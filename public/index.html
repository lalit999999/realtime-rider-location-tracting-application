<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>rider-location-tracting</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
  </head>
  <style>
    :root {
      color-scheme: light;
      --page-bg: #f4f1ea;
      --surface: #fffdfa;
      --surface-2: #fbf8f2;
      --border: #232323;
      --text: #1f1f1f;
      --muted: #66625a;
      --accent: #ece2d3;
      --accent-strong: #d8c4a8;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--page-bg);
      color: var(--text);
      font-family: "Trebuchet MS", "Comic Sans MS", "Segoe UI", sans-serif;
    }

    body {
      padding: 12px;
    }

    .app-shell {
      display: flex;
      gap: 12px;
      width: 100%;
      height: calc(100vh - 24px);
      border: 3px solid var(--border);
      border-radius: 28px;
      padding: 10px;
      background: var(--surface);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
      overflow: hidden;
    }

    .sidebar {
      width: 270px;
      min-width: 270px;
      border: 3px solid var(--border);
      border-radius: 24px;
      background: linear-gradient(180deg, #fffdf9 0%, #f7f1e7 100%);
      padding: 20px 18px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      overflow: hidden;
    }

    .profile-avatar {
      width: 155px;
      height: 155px;
      border: 4px solid var(--border);
      border-radius: 50%;
      background: #ffffff;
      object-fit: cover;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.03);
      margin-top: 4px;
    }

    .profile-meta {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 8px 8px 0;
      font-size: 16px;
      line-height: 1.35;
    }

    .profile-meta .label {
      font-weight: 700;
      margin-right: 6px;
    }

    .sidebar-footer {
      margin-top: auto;
      width: 100%;
    }

    .logout-btn {
      display: block;
      width: 100%;
      text-align: center;
      padding: 13px 16px;
      border: 3px solid var(--border);
      border-radius: 16px;
      background: var(--surface-2);
      color: var(--text);
      text-decoration: none;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.01em;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8);
    }

    .logout-btn:hover {
      background: var(--accent);
    }

    .map-panel {
      flex: 1;
      min-width: 0;
      border: 3px solid var(--border);
      border-radius: 24px;
      background: #ffffff;
      overflow: hidden;
      position: relative;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .map-loading {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 20px;
      pointer-events: none;
      z-index: 300;
    }

    @media (max-width: 900px) {
      body {
        padding: 8px;
      }

      .app-shell {
        flex-direction: column;
        height: auto;
        min-height: 100vh;
      }

      .sidebar {
        width: 100%;
        min-width: 0;
        flex-shrink: 0;
        max-height: 35vh;
        overflow-y: auto;
      }

      .map-panel {
        flex: 1;
        min-height: 60vh;
      }
    }
  </style>

  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <img
          id="userAvatar"
          class="profile-avatar"
          src="https://www.gravatar.com/avatar/?d=mp&s=300"
          alt="User avatar"
        />
        <div class="profile-meta">
          <div>
            <span class="label">Name:</span>
            <span id="userName">loading...</span>
          </div>
          <div>
            <span class="label">Email:</span>
            <span id="userEmail">loading...</span>
          </div>
        </div>

        <!-- Location status and controls -->
        <div
          id="locationStatus"
          style="margin-top: 12px; text-align: center; color: var(--muted)"
        ></div>
        <div style="margin-top: 8px">
          <button
            id="enableLocationBtn"
            style="
              display: none;
              width: 100%;
              padding: 10px;
              border-radius: 12px;
              border: 2px solid var(--border);
              background: var(--surface-2);
              font-weight: 700;
            "
          >
            Enable location
          </button>
        </div>

        <div class="sidebar-footer">
          <a class="logout-btn" href="/logout">Logout</a>
        </div>
      </aside>

      <main class="map-panel">
        <div id="map"></div>
        <div class="map-loading">map</div>
      </main>
    </div>
    <!-- leaflet script to show map and user location -->
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <!-- script for socket IO -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
      let currentUser = null;
      let socket = null;
      let map = null;

      function initializeMap() {
        if (map) return; // already initialized

        const mapContainer = document.getElementById("map");
        if (!mapContainer) {
          console.error("Map container #map not found");
          return;
        }

        map = L.map("map").setView([28.6139, 77.209], 13);

        L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
          maxZoom: 19,
          noWrap: true,
          attribution:
            '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>',
        }).addTo(map);

        map.setMaxBounds([
          [-85, -180],
          [85, 180],
        ]);
        map.options.worldCopyJump = false;

        const mapLoading = document.querySelector(".map-loading");

        map.whenReady(() => {
          if (mapLoading) {
            mapLoading.remove();
          }

          map.invalidateSize();
        });

        // trigger initial size calculation
        setTimeout(() => {
          map.invalidateSize();
        }, 100);
      }

      const remoteMarkers = new Map();
      const lastRenderedLocation = new Map();

      function removeRemoteMarker(userId) {
        if (!map) return;

        const marker = remoteMarkers.get(userId);

        if (marker) {
          map.removeLayer(marker);
          remoteMarkers.delete(userId);
        }

        lastRenderedLocation.delete(userId);
      }

      function renderRemoteLocation(data) {
        if (!map) return; // map not yet initialized

        const userId = data.userId ?? data.id;
        const latitude = Number(data.latitude);
        const longitude = Number(data.longitude);

        if (
          !userId ||
          !Number.isFinite(latitude) ||
          !Number.isFinite(longitude)
        ) {
          console.warn("Ignoring invalid remote location payload", data);
          return;
        }

        if (currentUser && userId === currentUser.userId) {
          return;
        }

        const locationKey = `${latitude}:${longitude}`;

        if (lastRenderedLocation.get(userId) === locationKey) {
          return;
        }

        lastRenderedLocation.set(userId, locationKey);

        if (!remoteMarkers.has(userId)) {
          const marker = L.marker([latitude, longitude])
            .addTo(map)
            .bindPopup(`User: ${userId}`);
          remoteMarkers.set(userId, marker);
        } else {
          const marker = remoteMarkers.get(userId);
          marker.setLatLng([latitude, longitude]);
        }
      }

      async function loadAuthenticatedUser() {
        const response = await fetch("/api/me");

        if (!response.ok) {
          window.location.href = "/login";
          throw new Error("Unable to load authenticated user");
        }

        currentUser = await response.json();

        const userAvatar = document.getElementById("userAvatar");
        const userName = document.getElementById("userName");
        const userEmail = document.getElementById("userEmail");

        userName.textContent = currentUser.name ?? "Unknown user";
        userEmail.textContent = currentUser.email ?? "Unknown email";

        if (currentUser.avatar) {
          userAvatar.src = currentUser.avatar;
        }
      }

      function connectSocket() {
        socket = io();

        socket.on("connect", () => {
          console.log("Socket connected successfully");
          showLocationStatus("Connected to server", false);
        });

        socket.on("connect_error", (error) => {
          console.error("Socket connection error:", error);
          showLocationStatus(
            "Connection error: " + (error.message || "Unknown error"),
            true,
          );
        });

        socket.on("disconnect", (reason) => {
          console.warn("Socket disconnected:", reason);
          showLocationStatus(
            "Disconnected from server. Reconnecting...",
            false,
          );
        });

        socket.on("user:authenticated", (user) => {
          console.log("Socket authenticated as", user);
        });

        socket.on("server:active-users", (users) => {
          if (!Array.isArray(users)) {
            return;
          }

          users.forEach(renderRemoteLocation);
        });

        socket.on("server:location:update", (data) => {
          renderRemoteLocation(data);
        });

        socket.on("client:error", ({ message }) => {
          console.error(message);
        });

        socket.on("client:duplicate", ({ userId, latitude, longitude }) => {
          console.info("Duplicate location ignored", {
            userId,
            latitude,
            longitude,
          });
        });

        socket.on("server:user:disconnected", ({ userId }) => {
          removeRemoteMarker(userId);
        });

        socket.on("server:user:inactive", ({ userId }) => {
          removeRemoteMarker(userId);
        });
      }

      // Geolocation management: use watchPosition and an inline status UI instead of repeated alerts
      let mycurrentlocation = null;
      let lastSentLocationKey = null;
      let watchId = null;

      function showLocationStatus(message, isError = false) {
        const el = document.getElementById("locationStatus");
        if (!el) return;
        el.textContent = message;
        el.style.color = isError ? "#b00020" : "var(--muted)";
      }

      function clearLocationStatus() {
        const el = document.getElementById("locationStatus");
        if (!el) return;
        el.textContent = "";
      }

      function stopWatchPosition() {
        if (watchId != null && "geolocation" in navigator) {
          navigator.geolocation.clearWatch(watchId);
          watchId = null;
        }
      }

      function startWatchPosition() {
        if (!("geolocation" in navigator)) {
          showLocationStatus(
            "Geolocation is not supported by your browser",
            true,
          );
          return;
        }

        if (!map) {
          showLocationStatus("Map is not yet initialized", true);
          return;
        }

        clearLocationStatus();

        watchId = navigator.geolocation.watchPosition(
          (position) => {
            const { latitude, longitude } = position.coords;
            console.log("Location updated:", { latitude, longitude });
            showLocationStatus("Location acquired ✓", false);
            // update marker and emit only when location changed
            if (!Number.isFinite(latitude) || !Number.isFinite(longitude))
              return;

            const locationKey = `${latitude}:${longitude}`;
            if (lastSentLocationKey === locationKey) {
              if (!mycurrentlocation) {
                mycurrentlocation = L.marker([latitude, longitude])
                  .addTo(map)
                  .bindPopup("You are here");
              } else {
                mycurrentlocation.setLatLng([latitude, longitude]);
              }
              return;
            }

            lastSentLocationKey = locationKey;

            // emit to server
            if (socket) {
              socket.emit("client:location:update", {
                userId: currentUser.userId,
                latitude,
                longitude,
              });
            }

            if (!mycurrentlocation) {
              mycurrentlocation = L.marker([latitude, longitude])
                .addTo(map)
                .bindPopup("You are here");
              // pan map to user on first locate
              map.setView([latitude, longitude], 15);
            } else {
              mycurrentlocation.setLatLng([latitude, longitude]);
            }
          },
          (error) => {
            console.error("watchPosition error", error);
            const btn = document.getElementById("enableLocationBtn");
            if (error.code === 1) {
              // PERMISSION_DENIED
              showLocationStatus(
                "Location permission denied. Enable location in your browser settings.",
                true,
              );
              if (btn) btn.style.display = "inline-block";
              stopWatchPosition();
            } else if (error.code === 3) {
              // TIMEOUT
              showLocationStatus(
                "Getting GPS location... (this may take 20-30 seconds on first use)",
              );
              // keep watching; browser will attempt again
            } else {
              showLocationStatus("Unable to retrieve your location.");
            }
          },
          {
            enableHighAccuracy: true,
            maximumAge: 0,
            timeout: 30 * 1000,
          },
        );
      }

      function requestLocationPermissionOnce() {
        if (!("geolocation" in navigator)) {
          showLocationStatus(
            "Geolocation is not supported by your browser",
            true,
          );
          return;
        }

        showLocationStatus(
          "Requesting location permission... (may take up to 30 seconds)",
        );
        navigator.geolocation.getCurrentPosition(
          (position) => {
            clearLocationStatus();
            // start continuous watch after a successful prompt
            startWatchPosition();
          },
          (error) => {
            console.error("Permission request failed", error);
            if (error.code === 1) {
              showLocationStatus(
                "Location permission denied. Enable it from browser settings.",
                true,
              );
              const btn = document.getElementById("enableLocationBtn");
              if (btn) btn.style.display = "inline-block";
            } else if (error.code === 3) {
              showLocationStatus(
                "GPS timeout. Try again or move to open area.",
                true,
              );
              const btn = document.getElementById("enableLocationBtn");
              if (btn) btn.style.display = "inline-block";
            } else {
              showLocationStatus("Unable to retrieve your location.", true);
            }
          },
          { enableHighAccuracy: true, timeout: 30 * 1000, maximumAge: 0 },
        );
      }

      async function main() {
        await loadAuthenticatedUser();

        // Initialize map after DOM is ready
        initializeMap();

        connectSocket();

        const enableBtn = document.getElementById("enableLocationBtn");
        if (enableBtn) {
          enableBtn.addEventListener("click", () => {
            // user gesture to trigger permission prompt
            requestLocationPermissionOnce();
            enableBtn.style.display = "none";
          });
        }

        // Use Permissions API when available to decide UX flow
        if (navigator.permissions && navigator.permissions.query) {
          try {
            const status = await navigator.permissions.query({
              name: "geolocation",
            });
            if (status.state === "granted") {
              startWatchPosition();
            } else if (status.state === "prompt") {
              // show a visible control so user can trigger the permission prompt
              showLocationStatus(
                "Please enable location to share your position.",
              );
              if (enableBtn) enableBtn.style.display = "inline-block";
            } else if (status.state === "denied") {
              showLocationStatus(
                "Location access is denied. Enable it from browser settings.",
                true,
              );
              if (enableBtn) enableBtn.style.display = "inline-block";
            }

            // react to permission state changes
            status.onchange = () => {
              if (status.state === "granted") startWatchPosition();
            };
          } catch (err) {
            // Permissions API may be unsupported or throw; fall back to showing enable button
            if (enableBtn) enableBtn.style.display = "inline-block";
          }
        } else {
          // No Permissions API - offer a button to request on user gesture
          if (enableBtn) enableBtn.style.display = "inline-block";
        }
      }

      window.addEventListener("load", main);

      // handle map resize on orientation change
      window.addEventListener("orientationchange", () => {
        if (map) {
          setTimeout(() => {
            map.invalidateSize();
          }, 100);
        }
      });

      // handle window resize
      window.addEventListener("resize", () => {
        if (map) {
          map.invalidateSize();
        }
      });
    </script>
  </body>
</html>
