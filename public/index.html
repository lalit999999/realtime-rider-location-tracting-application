<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>rider-location-tracting</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
  </head>
  <style>
    #map {
      height: 100vh;
    }
  </style>

  <body>
    <div
      style="
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 16px;
        background: #0f172a;
        color: #e2e8f0;
        font-family: system-ui, sans-serif;
        position: sticky;
        top: 0;
        z-index: 1000;
      "
    >
      <div>
        <strong>Live Location Tracking</strong>
        <div
          id="userInfo"
          style="font-size: 12px; color: #94a3b8; margin-top: 4px"
        >
          Loading authenticated user...
        </div>
      </div>
      <a
        href="/logout"
        style="color: #86efac; text-decoration: none; font-weight: 600"
        >Logout</a
      >
    </div>
    <div id="map"></div>
    <!-- leaflet script to show map and user location -->
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <!-- script for socket IO -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
      let currentUser = null;
      let socket = null;
      var map = L.map("map").setView([28.6139, 77.209], 13);

      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution:
          '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>',
      }).addTo(map);

      const remoteMarkers = new Map();
      const lastRenderedLocation = new Map();

      function removeRemoteMarker(userId) {
        const marker = remoteMarkers.get(userId);

        if (marker) {
          map.removeLayer(marker);
          remoteMarkers.delete(userId);
        }

        lastRenderedLocation.delete(userId);
      }

      function renderRemoteLocation(data) {
        const userId = data.userId ?? data.id;
        const latitude = Number(data.latitude);
        const longitude = Number(data.longitude);

        if (
          !userId ||
          !Number.isFinite(latitude) ||
          !Number.isFinite(longitude)
        ) {
          console.warn("Ignoring invalid remote location payload", data);
          return;
        }

        if (currentUser && userId === currentUser.userId) {
          return;
        }

        const locationKey = `${latitude}:${longitude}`;

        if (lastRenderedLocation.get(userId) === locationKey) {
          return;
        }

        lastRenderedLocation.set(userId, locationKey);

        if (!remoteMarkers.has(userId)) {
          const marker = L.marker([latitude, longitude])
            .addTo(map)
            .bindPopup(`User: ${userId}`);
          remoteMarkers.set(userId, marker);
        } else {
          const marker = remoteMarkers.get(userId);
          marker.setLatLng([latitude, longitude]);
        }
      }

      async function loadAuthenticatedUser() {
        const response = await fetch("/api/me");

        if (!response.ok) {
          window.location.href = "/login";
          throw new Error("Unable to load authenticated user");
        }

        currentUser = await response.json();
        document.getElementById("userInfo").textContent =
          `${currentUser.name} (${currentUser.email})`;
      }

      function connectSocket() {
        socket = io();

        socket.on("user:authenticated", (user) => {
          console.log("Socket authenticated as", user);
        });

        socket.on("server:active-users", (users) => {
          if (!Array.isArray(users)) {
            return;
          }

          users.forEach(renderRemoteLocation);
        });

        socket.on("server:location:update", (data) => {
          renderRemoteLocation(data);
        });

        socket.on("client:error", ({ message }) => {
          console.error(message);
        });

        socket.on("client:duplicate", ({ userId, latitude, longitude }) => {
          console.info("Duplicate location ignored", {
            userId,
            latitude,
            longitude,
          });
        });

        socket.on("server:user:disconnected", ({ userId }) => {
          removeRemoteMarker(userId);
        });

        socket.on("server:user:inactive", ({ userId }) => {
          removeRemoteMarker(userId);
        });
      }

      function getUserCurrentLocation() {
        return new Promise((resolve, reject) => {
          if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(
              (position) => {
                const { latitude, longitude } = position.coords;
                console.log("Current location obtained", {
                  latitude,
                  longitude,
                });
                // where i emit the location to server

                resolve({ latitude, longitude }); // ✅ Resolve the Promise
              },
              (error) => {
                console.error("Error obtaining location", error);
                alert(
                  "Unable to retrieve your location. Please allow location access and try again.",
                );
                reject(new Error("Unable to retrieve location")); // ✅ Reject the Promise
              },
              {
                enableHighAccuracy: true,
                timeout: 5000,
                maximumAge: 0,
              },
            );
          } else {
            alert("Geolocation is not supported by your browser");
            reject(new Error("Geolocation not supported")); // ✅ Reject if not supported
          }
        });
      }
      let mycurrentlocation = null;
      let lastSentLocationKey = null;
      async function main() {
        await loadAuthenticatedUser();
        connectSocket();

        setInterval(async () => {
          let latitude;
          let longitude;

          try {
            ({ latitude, longitude } = await getUserCurrentLocation());
          } catch (error) {
            console.error("Skipping location update:", error.message);
            return;
          }

          if (!Number.isFinite(latitude) || !Number.isFinite(longitude)) {
            console.warn("Skipping invalid local location update", {
              latitude,
              longitude,
            });
            return;
          }

          const locationKey = `${latitude}:${longitude}`;

          if (lastSentLocationKey === locationKey) {
            if (!mycurrentlocation) {
              mycurrentlocation = L.marker([latitude, longitude])
                .addTo(map)
                .bindPopup("You are here");
            } else {
              mycurrentlocation.setLatLng([latitude, longitude]);
            }

            return;
          }

          lastSentLocationKey = locationKey;

          socket.emit("client:location:update", {
            userId: currentUser.userId,
            latitude,
            longitude,
          });

          if (!mycurrentlocation) {
            mycurrentlocation = L.marker([latitude, longitude])
              .addTo(map)
              .bindPopup("You are here");
          } else {
            mycurrentlocation.setLatLng([latitude, longitude]);
          }
        }, 5 * 1000);
      }
      window.addEventListener("load", main);
    </script>
  </body>
</html>
