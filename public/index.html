<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>rider-location-tracting</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
  </head>
  <style>
    #map {
      height: 100vh;
    }
  </style>

  <body>
    <h1>heloo</h1>
    <div id="map"></div>
    <!-- leaflet script to show map and user location -->
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <!-- script for socket IO -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
      // socket
      const socket = io();

      var map = L.map("map").setView([28.6139, 77.209], 13);

      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution:
          '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>',
      }).addTo(map);

      function getUserCurrentLocation() {
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            function (position) {
              var lat = position.coords.latitude;
              var lng = position.coords.longitude;
              var marker = L.marker([lat, lng]).addTo(map);
              res({ latitude: lat, longitude: lng });
            },
            (error) => {
              alert("Error getting location: " + error.message);
            },
            {
              enableHighAccuracy: true,
            },
          );
        } else {
          alert("Geolocation is not supported by this browser.");
        }
      }
      let mycurrentlocation = null;
      async function main() {
        setInterval(async () => {
          const { latitude, longitude } = await getUserCurrentLocation();
          socket.emit("client:location :update", { latitude, longitude });
          if (!mycurrentlocation) {
            mycurrentlocation = L.marker([latitude, longitude])
              .addTo(map)
              .bindPopup("You are here")
              .openPopup();
          } else {
            mycurrentlocation.setLatLng([latitude, longitude]);
          }
        }, 5 * 1000);
      }
      window.onload = main;
    </script>
  </body>
</html>
