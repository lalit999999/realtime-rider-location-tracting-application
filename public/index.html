<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>rider-location-tracting</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
  </head>
  <style>
    #map {
      height: 100vh;
    }
  </style>

  <body>
    <h1>heloo</h1>
    <div id="map"></div>
    <!-- leaflet script to show map and user location -->
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <!-- script for socket IO -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
      // socket
      const socket = io();
      var map = L.map("map").setView([28.6139, 77.209], 13);

      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution:
          '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>',
      }).addTo(map);

      const remoteMarkers = new Map();

      socket.on("server:location:update", (data) => {
        const { id, latitude, longitude } = data;
        console.log("Received location update from server", {
          id,
          latitude,
          longitude,
        });
        if (!remoteMarkers.has(id)) {
          const marker = L.marker([latitude, longitude])
            .addTo(map)
            .bindPopup(`User: ${id}`);
          remoteMarkers.set(id, marker);
        } else {
          const marker = remoteMarkers.get(id);
          marker.setLatLng([latitude, longitude]);
        }
      });

      function getUserCurrentLocation() {
        return new Promise((resolve, reject) => {
          if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(
              (position) => {
                const { latitude, longitude } = position.coords;
                console.log("Current location obtained", {
                  latitude,
                  longitude,
                });
                // where i emit the location to server
                
                resolve({ latitude, longitude }); // ✅ Resolve the Promise
              },
              (error) => {
                console.error("Error obtaining location", error);
                alert(
                  "Unable to retrieve your location. Please allow location access and try again.",
                );
                reject(new Error("Unable to retrieve location")); // ✅ Reject the Promise
              },
              {
                enableHighAccuracy: true,
                timeout: 5000,
                maximumAge: 0,
              },
            );
          } else {
            alert("Geolocation is not supported by your browser");
            reject(new Error("Geolocation not supported")); // ✅ Reject if not supported
          }
        });
      }
      let mycurrentlocation = null;
      async function main() {
        setInterval(async () => {
          const { latitude, longitude }  = await getUserCurrentLocation();
          socket.emit("client:location:update", { latitude, longitude });
          if (!mycurrentlocation) {
            mycurrentlocation = L.marker([latitude, longitude])
              .addTo(map)
              .bindPopup("You are here");
          } else {
            mycurrentlocation.setLatLng([latitude, longitude]);
          }
        }, 5 * 1000);
      };
     window.addEventListener("load", main);
    </script>
  </body>
</html>
