<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Rider Location Tracking</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f172a;
        --card: rgba(15, 23, 42, 0.86);
        --border: rgba(148, 163, 184, 0.2);
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #22c55e;
        --accent-2: #16a34a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family:
          Inter,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background:
          radial-gradient(
            circle at top,
            rgba(34, 197, 94, 0.2),
            transparent 32%
          ),
          linear-gradient(135deg, #020617, #0f172a 45%, #111827);
        color: var(--text);
      }

      .card {
        width: min(92vw, 460px);
        padding: 2rem;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 24px;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(18px);
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.45rem 0.8rem;
        border-radius: 999px;
        background: rgba(34, 197, 94, 0.12);
        color: #86efac;
        font-size: 0.875rem;
        margin-bottom: 1rem;
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(2rem, 4vw, 2.6rem);
        line-height: 1.05;
      }

      p {
        margin: 0 0 1.5rem;
        color: var(--muted);
        line-height: 1.6;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        padding: 0.95rem 1.1rem;
        border: 0;
        border-radius: 14px;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: white;
        font-weight: 700;
        text-decoration: none;
        box-shadow: 0 12px 30px rgba(34, 197, 94, 0.28);
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease;
      }

      .btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 16px 34px rgba(34, 197, 94, 0.36);
      }

      .meta {
        margin-top: 1rem;
        font-size: 0.92rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge">Google OAuth 2.0 login</div>
      <h1>Welcome to Rider Location Tracking</h1>
      <p>
        Sign in with your Google account to access the live map, share your
        location, and see other riders move in real time.
      </p>
      <a class="btn" href="/auth/google">Login with Google</a>
      <div class="meta">
        Only authenticated users can access the main application.
      </div>
    </main>
  </body>
</html>
